<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Handball Tactic Board</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  
  <div id="app">
    <!-- Header Controls -->
    <header class="glass-panel">
      <div class="title-group">
        <h1>Handball Board</h1>
      </div>
      <div class="controls-group">
        <button id="btn-toggle-view" class="btn primary">Half Court</button>
        <button id="btn-draw-mode" class="btn secondary">Pen: OFF</button>
        <button id="btn-clear-draw" class="btn danger">Clear Pen</button>
        <select id="preset-select" class="btn secondary" style="cursor:pointer;">
          <option value="">-- 預設戰術 --</option>
        </select>
        <button id="btn-load-preset" class="btn primary">載入</button>
      </div>
    </header>

    <main id="board-container" class="full-court">
      <div id="zoom-wrapper">
      <!-- SVG Court Background (40x20 ratio -> 400x200 viewBox) -->
      <svg id="court-svg" viewBox="-20 -20 440 240" preserveAspectRatio="xMidYMid meet">
        
        <!-- Floor / Base inside the boundary (covering entire viewbox) -->
        <rect x="-20" y="-20" width="440" height="240" class="court-floor"/>
        <!-- Outer boundary line -->
        <rect x="0" y="0" width="400" height="200" class="court-line" fill="none"/>
        
        <!-- Center Line -->
        <line x1="200" y1="0" x2="200" y2="200" class="court-line" />
        
        <!-- Left Side -->
        <!-- Goal Area (6m) -->
        <path d="M 0 25 A 60 60 0 0 1 60 85 L 60 115 A 60 60 0 0 1 0 175 Z" class="court-area goal-area left" />
        <path d="M 0 25 A 60 60 0 0 1 60 85 L 60 115 A 60 60 0 0 1 0 175" class="court-line goal-line" fill="none" />
        <!-- Free Throw Line (9m) - Dashed -->
        <path d="M 29.58 0 A 90 90 0 0 1 90 85 L 90 115 A 90 90 0 0 1 29.58 200" class="court-line dashed-line" fill="none" />
        <!-- 7m Penalty Mark -->
        <line x1="70" y1="95" x2="70" y2="105" class="court-line mark-line" />
        <!-- Goalkeeper 4m Line -->
        <line x1="40" y1="97" x2="40" y2="103" class="court-line mark-line" />
        <!-- Substitution Line -->
        <line x1="155" y1="195" x2="155" y2="205" class="court-line mark-line" />
        <!-- Goal -->
        <rect x="-10" y="85" width="10" height="30" class="goal-posts" />
        
        <!-- Right Side -->
        <!-- Goal Area (6m) -->
        <path d="M 400 25 A 60 60 0 0 0 340 85 L 340 115 A 60 60 0 0 0 400 175 Z" class="court-area goal-area right" />
        <path d="M 400 25 A 60 60 0 0 0 340 85 L 340 115 A 60 60 0 0 0 400 175" class="court-line goal-line" fill="none" />
        <!-- Free Throw Line (9m) - Dashed -->
        <path d="M 370.42 0 A 90 90 0 0 0 310 85 L 310 115 A 90 90 0 0 0 370.42 200" class="court-line dashed-line" fill="none" />
        <!-- 7m Penalty Mark -->
        <line x1="330" y1="95" x2="330" y2="105" class="court-line mark-line" />
        <!-- Goalkeeper 4m Line -->
        <line x1="360" y1="97" x2="360" y2="103" class="court-line mark-line" />
        <!-- Substitution Line -->
        <line x1="245" y1="195" x2="245" y2="205" class="court-line mark-line" />
        <!-- Goal -->
        <rect x="400" y="85" width="10" height="30" class="goal-posts" />
      </svg>

      <!-- Drawing Layer -->
      <canvas id="drawing-layer"></canvas>

      <!-- Tokens Layer -->
      <div id="tokens-layer"></div>
      
      </div>
    </main>

    <!-- Footer / Animation & Roster Controls -->
    <footer class="glass-panel">
      <div class="roster-group">
        <button id="add-red" class="btn token-btn bg-red">+ Red</button>
        <button id="add-blue" class="btn token-btn bg-blue">+ Blue</button>
        <button id="add-ball" class="btn token-btn bg-yellow">+ Ball</button>
        <button id="btn-clear-tokens" class="btn danger">Clear</button>
      </div>
      <div class="animation-group">
        <button id="btn-add-frame" class="btn primary">Save Frame</button>
        <button id="btn-prev-frame" class="btn secondary">◀ Prev</button>
        <button id="btn-play" class="btn success">Play Animation</button>
        <button id="btn-next-frame" class="btn secondary">Next ▶</button>
        <button id="btn-clear-frames" class="btn danger">Clear Frames</button>
        <button id="btn-delete-frame" class="btn danger">Delete Frame</button>
        <button id="btn-export-video" class="btn bg-red">Record Video</button>
        <button id="btn-export-json" class="btn bg-blue">Save Play</button>
        <button id="btn-import-json" class="btn bg-blue">Load Play</button>
        <input type="file" id="file-import-json" accept=".json" style="display: none;" />
      </div>
    </footer>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
